name: Tag version

# Tags and releases every VERSION bump that lands on main (issue #669).
#
# VERSION is bumped in ordinary feature PRs (see CLAUDE.md "VERSION is the
# release on main"), but releases were only ever cut by the interactive
# /repo:release command, so the newest tag lagged VERSION by dozens of bumps and
# a consumer could not pin a release or map a version number to a commit. This
# closes that gap: when a push to main changes VERSION to a version with no tag
# yet, tag that exact commit and publish a release.
#
# Idempotent: a push that does not change VERSION, or whose tag already exists
# (e.g. cut by hand via /repo:release), does nothing and exits 0.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Queue rather than cancel, so a burst of merges cannot skip a VERSION bump.
concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tag and release a changed VERSION
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # First push / force-push has an all-zero or unreachable `before`;
          # fall back to the parent commit.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse "$SHA^" 2>/dev/null || true)"
          fi
          new="$(tr -d '[:space:]' < VERSION)"
          old=""
          if [[ -n "$BEFORE" ]]; then
            old="$(git show "$BEFORE:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          fi
          if [[ "$new" == "$old" ]]; then
            echo "VERSION unchanged ($new); nothing to tag."
            exit 0
          fi
          if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$new' is not X.Y.Z; nothing to tag."
            exit 0
          fi
          tag="v$new"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes
